name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📥 Install dependencies
        run: npm install

      - name: ⚙️ Prebuild Android
        run: npx expo prebuild -p android

      - name: 🔑 Generate Keystore
        run: |
          keytool -genkey -v -keystore my-release-key.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=test, OU=test, O=test, L=test, S=test, C=US"
          
      - name: 🔨 Build Android Release APK
        env:
          MYAPP_UPLOAD_STORE_FILE: ../my-release-key.keystore
          MYAPP_UPLOAD_STORE_PASSWORD: password
          MYAPP_UPLOAD_KEY_ALIAS: my-key-alias
          MYAPP_UPLOAD_KEY_PASSWORD: password
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 🔨 Build Android Dev APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 🚀 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixora-App-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: 🚀 Upload Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixora-App-Dev
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
